<html>

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-7FN7LEVWXD"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

      <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fancy Pants Adventure | Seraph</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: black;
      }
    </style>
  </head>
  <body>
    <div id="ruffle" width="100%" height="100%"></div>
    <script>
      function loadCdnRuffle() {
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@ruffle-rs/ruffle';
          document.body.appendChild(s);
      }

      var localScript = document.createElement('script');
      localScript.src = '../_ruffle/ruffle.js';
      localScript.onerror = loadCdnRuffle;
      document.body.appendChild(localScript);
    </script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("fancypantsadventure.swf");
      });
    </script>
  </body>
</html>
