<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Read Schplay announcements, product updates, classroom tips, and community stories.">
    <meta name="keywords" content="schplay blog, game updates, classroom gaming, new releases, schplay news">
    <meta name="theme-color" content="#0f1a2a">
    <title>Schplay Blog</title>
    <link rel="canonical" href="https://schplay.com/blog.html">
    <link rel="icon" type="image/webp" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/favicon-32x32.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Schplay">
    <meta property="og:title" content="Schplay Blog">
    <meta property="og:description" content="News, patch notes, and guides from the Schplay team.">
    <meta property="og:url" content="https://schplay.com/blog.html">
    <meta property="og:image" content="https://schplay.com/images/logo.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Schplay Blog">
    <meta name="twitter:description" content="Stay up to date with Schplay announcements and tips.">
    <meta name="twitter:image" content="https://schplay.com/images/logo.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/new-style.css">
    <link rel="stylesheet" href="css/restyle.css">
    <link rel="stylesheet" href="css/user-choice.css">
    <link rel="stylesheet" href="css/blog.css">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Blog",
            "name": "Schplay Blog",
            "url": "https://schplay.com/blog.html",
            "description": "Editorial updates and product announcements from Schplay.",
            "publisher": {
                "@type": "Organization",
                "name": "Schplay",
                "url": "https://schplay.com"
            }
        }
    </script>
</head>
<body class="blog-paper">
  <header id="site-header" role="banner">
    <div id="navbar-placeholder"></div>
  </header>

  <main class="container" role="main">
    <section class="hero" aria-labelledby="blog-hero-title">
      <div class="hero-content">
        <h1 id="blog-hero-title">Schplay Blog</h1>
        <p>Simple updates, patch notes, and guides from the Schplay team.</p>
        <div class="hero-actions">
          <a class="hero-primary" href="blog/post-template.html">Use Post Template</a>
        </div>
      </div>
    </section>

    <section aria-label="Latest articles">
      <p id="blog-results-count" class="blog-results-count" aria-live="polite"></p>
      <div id="blog-posts-grid" class="posts-grid"></div>
    </section>

  </main>

  <footer id="site-footer" role="contentinfo">
    <div id="footer-placeholder"></div>
  </footer>

  <script src="js/blog.js" defer></script>
  <script src="js/load-components.js" defer data-component-root="./"></script>
  <script src="/js/lazy-media.js" defer></script>
</body>
</html>
